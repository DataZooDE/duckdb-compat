name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Pure dispatch tests (no DuckDB)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug && cmake --build build && ctest --test-dir build --output-on-failure

  probe:
    # Every helper instantiated against the REAL headers of each DuckDB line we
    # ship for. Add a line here when DuckDB (or community-extensions'
    # DUCKDB_LATEST_STABLE) moves.
    name: Probe (${{ matrix.line }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        line: [v1.5.6, v2.0 (community-extensions default)]
        include:
          - line: v1.5.6
            ref: v1.5.6
          - line: v2.0 (community-extensions default)
            ref: d54cbbe3df17e8e5ce68312f483b4155836112aa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: duckdb/duckdb
          ref: ${{ matrix.ref }}
          path: duckdb
          sparse-checkout: |
            src/include
            third_party/httplib
      - name: Probe with g++ (Windows SDK macros IN/OUT/OPTIONAL/CALLBACK/... simulated)
        if: runner.os == 'Linux'
        run: |
          for probe in test/probe.cpp test/filter_probe.cpp; do
            g++ -std=c++17 -fsyntax-only -Wall -Iinclude -Iduckdb/src/include "$probe"
            g++ -std=c++17 -fsyntax-only -Wall -DIN= -DOUT= -DOPTIONAL= -DCALLBACK= -DCONST= -DVOID=void -DFAR= -DNEAR= -DPASCAL= -DWINAPI= -DCALLBACK= -DWINAPI= -DPASCAL= -DAPIENTRY= -DFAR= -DNEAR= -DCONST=const -Iinclude -Iduckdb/src/include "$probe"
          done
      - name: Probe with clang++ (stricter two-phase lookup, as on macOS)
        if: runner.os == 'Linux'
        run: |
          for probe in test/probe.cpp test/filter_probe.cpp; do
            clang++ -std=c++17 -fsyntax-only -Wall -Iinclude -Iduckdb/src/include "$probe"
            clang++ -std=c++17 -fsyntax-only -Wall -DIN= -DOUT= -DOPTIONAL= -DCALLBACK= -DCONST= -DVOID=void -DFAR= -DNEAR= -DPASCAL= -DWINAPI= -DCALLBACK= -DWINAPI= -DPASCAL= -DAPIENTRY= -DFAR= -DNEAR= -DCONST=const -Iinclude -Iduckdb/src/include "$probe"
          done
      - name: Probe httplib helpers (bundled httplib + OpenSSL)
        if: runner.os == 'Linux'
        run: g++ -std=c++17 -fsyntax-only -Iinclude -Iduckdb/src/include -Iduckdb/third_party/httplib test/probe_httplib.cpp
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Probe with MSVC (real <windows.h>)
        if: runner.os == 'Windows'
        run: |
          cl /nologo /std:c++17 /EHsc /Zs /permissive- /Iinclude /Iduckdb\src\include test\probe.cpp
          cl /nologo /std:c++17 /EHsc /Zs /permissive- /Iinclude /Iduckdb\src\include test\filter_probe.cpp
